<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #0f0f0f;
      color: #fff;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: #aaa; line-height: 1.4; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover { opacity: 0.9; }
    .secondary {
      background: #2a2a2a;
      color: #eee;
    }
    .status {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Devin Design Mode</h1>
  <p>Toggle design mode on the current page, then click or drag to select UI elements.</p>
  <button id="toggle">Toggle Design Mode</button>
  <button id="options" class="secondary">Open Settings</button>
  <div class="status" id="status">Not configured</div>
  <div class="hint">Shortcut: Cmd/Ctrl + Shift + D</div>
  <script src="popup.js"></script>
</body>
</html>
